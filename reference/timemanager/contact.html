<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
                <img src="Images/icon.png" alt="Time Manager" height="32" width="32">
                <span>Time Manager</span>
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navContact">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContact">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- MAIN SECTION -->
    <div class="contact-section d-flex align-items-center">

        <div class="container">

            <div class="row justify-content-center">

                <!-- FORM CARD -->
                <div class="col-md-6">

                    <div class="contact-card">

                        <h2 class="text-center mb-4">Contact Us</h2>

                        <p class="text-center text-muted mb-4">
                            Have an issue or feedback? Let us know and we�ll help you.
                        </p>

                        <form>

                            <label>Full Name</label>
                            <input class="form-control mb-3" placeholder="Enter your full name">

                            <label>Email</label>
                            <input class="form-control mb-3" placeholder="Enter your email">

                            <label>Phone Number</label>
                            <input class="form-control mb-3" placeholder="Enter your phone number">

                            <label>Description</label>
                            <textarea class="form-control mb-4" placeholder="Describe your issue..."></textarea>

                            <button class="btn btn-primary w-100">Submit</button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
