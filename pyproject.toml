[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doomalaysocreate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
